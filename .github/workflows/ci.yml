name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.8"
          enable-cache: true

      - name: Abhängigkeiten installieren
        run: uv sync --locked

      - name: requirements.txt prüfen
        # Das Docker-Image installiert aus requirements.txt, sie muss dem Export aus uv.lock entsprechen
        run: |
          uv export --format requirements-txt --no-hashes --no-dev -o requirements.txt
          git diff --exit-code requirements.txt

      - name: Ruff
        run: uv run ruff check

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest
