name: Docker build and publish image
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Log in to Docker Hub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build the Docker image
      run: |
        TAGS="-t wlanboy/prometheus-helper:latest"
        if [ "$GITHUB_REF_TYPE" = "tag" ]; then
          TAGS="$TAGS -t wlanboy/prometheus-helper:${GITHUB_REF_NAME#v}"
        fi
        docker build --build-arg REVISION=${{ github.sha }} $TAGS .
    - name: Docker Push
      run: docker push --all-tags wlanboy/prometheus-helper
